  about:
    label: "01 / about"
    heading: "A builder who likes the whole stack."
    p1: "I'm a <b>CTO and senior software engineer</b> with 8+ years turning ambiguous ideas into shipped products. I started in early-stage startups and have since worked across private companies and public-sector projects, giving me a broad perspective on how technology supports different kinds of organisations."
    p2: "My daily driver is <b>Ruby on Rails</b> with React and TypeScript, backed by AWS. I have also worked extensively with <b>.NET, C#, and Azure</b> on public-sector systems. What motivates me is the chance to keep learning, work closely with others, and build technology that is both useful and sustainable. Currently based in <b>Norway</b>, open to remote roles worldwide."
    stat_years_n: "8+"
    stat_years_l: "years of professional engineering"
    stat_products_n: "10k+"
    stat_products_l: "businesses using products I built"
    stat_oss_n: "5"
    stat_oss_l: "companies from startup to enterprise"
    highlight_perf_icon: "&#9889;"
    highlight_perf_title: "Performance-first"
    highlight_perf_body: "I treat response time as a feature. My go-to toolkit: N+1 squashing, counter caches, database index audits, and HTTP caching with Turbo Frames."
    highlight_ship_icon: "&#128196;"
    highlight_ship_title: "Shipping culture"
    highlight_ship_body: "I introduced CI/CD pipelines, testing practices, and agile methods to ensure reliable delivery. I have led teams from 2 to 9 developers while maintaining test coverage above 90%."
    highlight_data_icon: "&#128202;"
    highlight_data_title: "Strategic and hands-on"
    highlight_data_body: "As CTO I work closely with founders and product teams to translate business needs into technical solutions, while still writing code, integrating AI, and designing architecture that scales."
    highlight_remote_icon: "&#127757;"
    highlight_remote_title: "Full-stack breadth"
    highlight_remote_body: "Rails, React, .NET, AWS, Azure, PostgreSQL, microservices. I learn whatever the project needs and have delivered across fintech, public sector, and enterprise SaaS."

