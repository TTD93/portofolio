    job2_b2: "Definerte kodearkitektur, mentorerte utviklere og justerte teknisk gjennomforing mot forretningsmаl via OKR."
    job2_b3: "Senior backend-utvikler hos UDI pa interne ERP-systemer for visa- og oppholdstillatelsesbehandling."
    job2_b4: "Integrerte Folkeregisteret, implementerte sentralisert logging med Elasticsearch og Kibana, og bidro til Azure-migrasjon."

