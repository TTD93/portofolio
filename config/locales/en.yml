  about:
    label: "01 / about"
    heading: "A builder who likes the whole stack."
    p1: "I have spent most of my career in the finance industry. I started at Luca Labs, working on a web-based accounting system. From there I moved to Arvato Finance, working on debt collection (inkasso) systems, then spent a few years as a consultant in the public sector, before going back to accounting software, this time year-end reporting tools for accountants at Brevio. These days I am building financial software again as CTO at CostTracker, where we build procurement and spend-management systems."
    p2: "I am driven by the entire product lifecycle, from initial concept to deployment, working alongside design, product, and business teams. First and foremost, though, I love being in the trenches: writing code, sketching out architectures, and figuring out how things should work under the hood. To keep my approach fresh and grounded in best practices, I consistently research engineering literature and study how other engineering organizations tackle similar challenges."
    p3: "Most of my work lives inside proprietary codebases, whether in funded startups or closed enterprise projects. I do not publish hobby projects for the sake of it, my energy goes into the products I work on professionally. That said, if you want to see how I write code, I am happy to share examples on request."
    highlight_perf_title: "Performance-first"
    highlight_perf_body: "I pay close attention to response times and benchmark continuously throughout development. I usually start at the database: squashing N+1 queries, setting up views, using counter caches, and auditing indexes. From there I lean on caching (Redis server-side, plus standard client-side caching), offload slow work to background jobs, paginate to avoid over-fetching, and keep monitoring in place to catch regressions early."
    highlight_ship_title: "Shipping culture"
    highlight_ship_body: "I care about tests that catch real problems: unit tests, integration tests, feature tests, and end-to-end tests working together. I have introduced testing strategies on a few projects and treat a broken test as worth looking into."
    highlight_teams_title: "Team leadership"
    highlight_teams_body: "I have led teams since early in my career, with a steady focus on delivery. I mentor developers, keep projects moving, and pick whichever framework fits the team, whether that is Scrum, Kanban, OKRs, or Shape Up, rather than forcing one process on every situation. I have also worked and collaborated across product teams to build shared infrastructure and design."
    highlight_data_title: "Collaborative and hands-on"
    highlight_data_body: "I work with management and product teams to help translate business needs into technical solutions, while also writing code, integrating AI, and contributing to architecture decisions that support scalability. I enjoy being part of multidisciplinary product teams, working alongside design and product to find good solutions together, and I try to lead by staying involved in the day-to-day work."
    highlight_security_title: "Security built in"
    highlight_security_body: "Security is a fundamental requirement in my development process. I build systems with secure cloud infrastructure, comprehensive audit logging, and compliance in mind. To ensure those defenses hold up, I routinely run vulnerability scans and penetration tests, proactively identifying and closing risks before they can be exploited."
    highlight_cost_title: "Cost-Conscious Engineering"
    highlight_cost_body: "I view cost efficiency as a key architectural metric. I actively reduce unnecessary overhead by migrating stacks to more cost-effective cloud services, right-sizing infrastructure, and minimizing compute waste through strategic caching and background processing. When evaluating new tools or architecture, I focus on optimizing spend without ever sacrificing performance or development speed."

  experience:
    label: "02 / experience"
    heading: "Where I have worked."

    job1_title: "Chief Technical Officer (CTO)"
    job1_org: "Costtracker AS, Oslo, Norway"
    job1_when: "2024 to present"
    job1_b1: "Hands-on CTO for product and engineering on a procurement SaaS covering purchase orders, budgets, and cash flow. Write production code alongside setting technical direction."
    job1_b2: "Led the transition from outsourced to in-house development. Helped build the team, and introduced CI/CD, agile processes, coding standards, and a documentation-first culture."
    job1_b3: "Introduced end-to-end and feature tests from scratch, aiming for a testing strategy focused on confidence and reliability rather than just coverage numbers."
    job1_b4: "Integrated AI capabilities including document parsing and smart categorisation. Worked on cloud architecture on AWS and Heroku with security and compliance in mind."
    job1_b5: "New features and reliability work contributed to revenue growth and helped onboard some larger customers."

    job2_title: "Senior Software Engineer / Tech Lead"
    job2_org: "Sopra Steria AS, Oslo, Norway"
    job2_when: "2023 to 2024"
    job2_b1: "Tech lead on a greenfield ERP system for the Agency for Urban Environment (Bymiljøetaten), supporting private contractors in road maintenance across Oslo. Worked with a team of four developers."
    job2_b2: "Helped define code architecture and documentation standards, supported other developers, and kept technical execution aligned with business goals using OKR."
    job2_b3: "Introduced feature and integration tests early in the project to help catch regressions before production, and worked with the team on shared coding guidelines."
    job2_b4: "Worked as a backend developer at the Norwegian Directorate of Immigration (UDI) on visa and residence permit systems. Integrated the National Population Register, worked on centralised logging with Elasticsearch and Kibana, and contributed to an Azure migration."

    job3_title: "Senior Developer"
    job3_org: "Brevio AS, Oslo, Norway"
    job3_when: "2021 to 2023"
    job3_b1: "Senior full-stack developer on Brevio Confirm and Brevio Sign, used by several of Norway's larger auditing firms. Shared backend ownership with the CTO and contributed to architecture decisions."
    job3_b2: "Worked across the microservice architecture, contributed to shipping new product features end-to-end, and wrote documentation for internal APIs and developer workflows."
    job3_b3: "Raised test coverage by more than 20 percentage points with a focus on meaningful feature and integration tests, not just unit test count. Helped reduce server-side error rates."
    job3_b4: "Contributed to improving error monitoring, on-call runbooks, and incident response processes."

    job4_title: "Full-Stack Developer"
    job4_org: "Arvato Finance AS, Oslo, Norway"
    job4_when: "2020 to 2021"
    job4_b1: "Worked on modernising a legacy invoicing core system and its transition to a microservice architecture in .NET, writing technical documentation along the way."
    job4_b2: "Introduced integration tests and end-to-end test coverage for the invoice pipeline, aiming for more confidence before each release."
    job4_b3: "Stepped into a tech lead role for a period, co-defined code standards and error handling patterns with senior architects, and helped onboard new developers."

    job5_title: "Full-Stack Developer to Senior Developer and Project Manager"
    job5_org: "Luca Labs AS, Oslo, Norway"
    job5_when: "2017 to 2020"
    job5_b1: "Joined at founding stage as a full-stack developer (2017 to 2019), promoted to senior developer (2019 to 2020). Worked with the CTO on the major features of a web-based accounting system: invoicing, payroll, bank reconciliation, tax filing, and automated bookkeeping. Distributed through DNB and Nordea."
    job5_b2: "Started Luca Scan as a bachelor thesis project together with four fellow students, then took on sole responsibility for developing and maintaining it after joining the company. Luca Scan automates the registration of supplier invoices using machine learning: it receives invoices by email or API call, reads them with an in-house machine learning model, and forwards them in EHF (Electronic Trade Format) to the customer's accounting system. Built with Ruby on Rails, MySQL, HTML/CSS, and JavaScript."
    job5_b3: "Built Luca's mobile receipt app for Android and iOS, letting users scan receipts with AI-powered recognition to automate bookkeeping on the go."
    job5_b4: "Aimed to keep test coverage above 90% through unit, feature, and end-to-end tests. Wrote and maintained developer documentation as the team grew from 2 to 9 over 18 months."
    job5_b5: "Took on project management, recruitment, and direct collaboration with banking partners. Helped onboard developers who joined the team."

    edu_title: "Bachelor in Programming"
    edu_org: "Norwegian School of Information Technology (NITH)"
    edu_when: "2013 to 2017"
    edu_desc: "Bachelor's degree in programming. Foundation in software development, algorithms, and systems design."

  products:
    label: "03 / products"
    heading: "Things I have built."
    intro: "Products I was a key developer or technical lead in building, built from scratch, shipped to real users."
    role_cto: "Main developer and CTO"
    role_key: "Key developer"
    costtracker_desc: "A procurement and spend-management SaaS I help build and lead as CTO. CostTracker aims to give finance teams real-time visibility into company spending, from purchase requisitions and multi-step approval workflows through to budget tracking, cash-flow forecasting, and automated reporting. Integrates with Xero, QuickBooks, Sage, and 24SevenOffice. Used by businesses across Europe, including some publicly traded ones."
    luca_desc: "A Norwegian accounting system built for small businesses and sole proprietorships. I joined at founding stage and worked on the core together with the CTO: invoicing via email, EHF and Vipps, mobile receipt scanning with AI-powered auto-bookkeeping, VAT and tax filing, payroll, bank integrations, and multi-company support. Launched with DNB and piloted with Nordea. Now used by thousands of businesses."
    riverty_desc: "Joined a cross-functional team to help build Riverty's invoice module. The platform handles the invoice lifecycle: automated generation, multi-channel delivery (digital, email, SMS, letter), payment tracking, and accounts receivable management, across Norway, Sweden, Finland and Denmark in four currencies. Offered as full administration, invoice factoring, or invoice financing."
    brevio_confirm_desc: "One of two main developers on this platform. Brevio Confirm is a Nordic provider of external audit confirmations. It lets auditors request bank confirmations, lawyer letters, and balance statements from Nordic banks through a single portal, digitising a process that used to be mostly paper-based. Supports batch-sending, a REST API, and country-specific workflows."
    brevio_sign_desc: "Built alongside Brevio Confirm as one of two core developers. Brevio Sign is a digital signature platform for auditors and accounting firms. It supports major Nordic eID methods, aims to comply with EU eIDAS standards, and allows batch signing across multiple documents in a single session. Pay-per-use pricing makes it easier for firms to pass costs directly to clients."
