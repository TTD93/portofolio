  products:
    label: "03 / produkter"
    heading: "Ting jeg har bygget."
    intro: "Produkter der jeg var en nokkelfigur som utvikler eller teknisk leder, bygget fra bunnen av og levert til ekte brukere."
    role_cto: "Hovedutvikler og CTO"
    role_key: "Nokkelfigur i utviklingen"
    costtracker_desc: "Et anskaffelses- og utgiftsstyringssystem jeg bygget og fortsatt leder som CTO. CostTracker gir okonomiteam full sanntidsoversikt over bedriftens utgifter, fra innkjopsrekvisisjoner og flertrinns godkjenningsflyter til budsjettstyring, kontantstromsprognoser og automatisert rapportering. Integrerer med Xero, QuickBooks, Sage og 24SevenOffice. Brukes av voksende bedrifter i hele Europa, inkludert borsnoterte selskaper."
    luca_desc: "Et komplett norsk regnskapssystem bygget fra bunnen av for sma bedrifter og enkeltpersonforetak. Jeg kom inn ved grunnleggerstadiet og bygget kjernen sammen med CTO: fakturering via e-post, EHF og Vipps, mobil kvitteringsskanning med AI-drevet automatisk bokforing, mva- og skatteinnlevering, lonnsoppgjor, bankintegrasjoner og flerselskapsstotte. Lansert med DNB og pilotert med Nordea. Brukes na av 10 000+ bedrifter."
    riverty_desc: "Ble med i et tverrfaglig team for a bygge Rivertys fakturamodul fra bunnen av. Plattformen handterer hele fakturans livssyklus: automatisk generering, flerkanalsdistribusjon (digitalt, e-post, SMS, brev), betalingssporing og debitorstyring, pa tvers av Norge, Sverige, Finland og Danmark i fire valutaer."
    brevio_confirm_desc: "En av to hovedutviklere som bygget denne plattformen. Brevio Confirm er Nordens storste leverandor av eksterne revisjonsbekreftelser. Den lar revisorer bestille bankbekreftelser, advokatbrev og saldoutskrifter fra 250+ nordiske banker via en enkelt portal, og digitaliserer en prosess som tidligere var helt papirbasert."
    brevio_sign_desc: "Co-bygget ved siden av Brevio Confirm som en av to hovedutviklere. Brevio Sign er en digital signeringsplattform spesiallaget for revisorer og regnskapsfirmaer. Stotter alle store nordiske eID-metoder, er i samsvar med EU eIDAS-standarder, og muliggjor massesignering pa tvers av flere dokumenter i en sesjon."
    live_product: "se produkt"

