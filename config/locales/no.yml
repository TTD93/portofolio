  about:
    label: "01 / om meg"
    heading: "En byggmester som liker hele stacken."
    p1: "Jeg har jobbet i finansbransjen mesteparten av karrieren min. Jeg startet i Luca Labs, hvor jeg jobbet med et nettbasert regnskapssystem. Derfra gikk jeg til Arvato Finance og jobbet med inkassosystemer, og jobbet så noen år som konsulent i offentlig sektor, før jeg gikk tilbake til regnskapsprogramvare, denne gangen årsoppgjørsverktøy for regnskapsførere i Brevio. I dag bygger jeg finansiell programvare igjen som CTO i CostTracker, hvor vi bygger innkjøps- og utgiftsstyringssystemer. Utenom jobb er jeg kattepappa til to."
    p2: "Jeg drives av hele produktløpet, fra idé til lansering, i samarbeid med design-, produkt- og forretningsteam. Men først og fremst liker jeg å være i skyttergravene: skrive kode, tegne opp arkitekturer og finne ut hvordan ting bør henge sammen under panseret. For å holde tilnærmingen min fersk og forankret i beste praksis, leser jeg jevnlig faglitteratur og studerer hvordan andre teknologiorganisasjoner løser lignende utfordringer."
    p3: "Det meste av arbeidet mitt lever i lukkede kodebaser, enten i oppstartsbedrifter eller kommersielle prosjekter. Jeg publiserer ikke hobbyprosjekter for synlighetens skyld. Energien min går inn i produktene jeg jobber med profesjonelt. Ønsker du å se hvordan jeg skriver kode, deler jeg gjerne eksempler på forespørsel."
    highlight_perf_title: "Ytelse som funksjon"
    highlight_perf_body: "Jeg er opptatt av responstid og benchmarker kontinuerlig underveis i utviklingen. Jeg starter som regel i databasen: eliminerer N+1-spørringer, setter opp views, bruker tellerbuffere og reviderer indekser. Derfra bruker jeg bufring (Redis på serversiden, i tillegg til vanlig klientsidebufring), flytter tunge jobber til bakgrunnsprosesser, paginerer for å unngå overhenting, og har overvåkning på plass for å fange opp regresjoner tidlig."
    highlight_ship_title: "Leveringskultur"
    highlight_ship_body: "Jeg er opptatt av tester som fanger opp reelle problemer: enhetstester, integrasjonstester, funksjonalitetstester og ende-til-ende-tester som virker sammen. Jeg har innført teststrategier på noen prosjekter og ser på en knekt test som verdt å se nærmere på."
    highlight_teams_title: "Teamledelse"
    highlight_teams_body: "Jeg har ledet team siden tidlig i karrieren, med et jevnt fokus på leveranse. Jeg veileder utviklere, holder prosjekter i bevegelse, og velger det rammeverket som passer teamet, enten det er Scrum, Kanban, OKR eller Shape Up, fremfor å presse én prosess på alt. Jeg har også jobbet og samarbeidet på tvers av produktteam for å bygge felles infrastruktur og design."
    highlight_data_title: "Samarbeidsorientert og hands-on"
    highlight_data_body: "Jeg jobber med ledelsen og produktteam for å bidra til å oversette forretningsmål til tekniske løsninger, samtidig som jeg også skriver kode, integrerer AI og bidrar til arkitekturbeslutninger som støtter skalerbarhet. Jeg trives i tverrfaglige produktteam, i samarbeid med design og produkt for å finne gode løsninger sammen, og jeg prøver å lede ved å holde meg involvert i det daglige arbeidet."
    highlight_security_title: "Sikkerhet innebygd"
    highlight_security_body: "Sikkerhet er et grunnleggende krav i utviklingsprosessen min. Jeg bygger systemer med sikker skyinfrastruktur, grundig revisjonslogging og etterlevelse i tankene. For å sikre at dette faktisk holder mål, kjører jeg jevnlig sårbarhetsskanning og penetrasjonstester, og identifiserer og lukker risikoer proaktivt før de kan utnyttes."
    highlight_cost_title: "Kostnadsbevisst ingeniørkunst"
    highlight_cost_body: "Jeg ser kostnadseffektivitet som en sentral arkitektonisk metrikk. Jeg reduserer aktivt unødvendig overhead ved å flytte systemer til mer kostnadseffektive skytjenester, tilpasse infrastruktur til faktisk behov, og minimere sløsing med regnekraft gjennom strategisk bufring og bakgrunnsprosessering. Når jeg vurderer nye verktøy eller arkitektur, prøver jeg å optimalisere kostnadene uten å gå på akkord med ytelse eller utviklingshastighet."

  experience:
    label: "02 / erfaring"
    heading: "Hvor jeg har jobbet."

    job1_title: "Teknisk direktør (CTO)"
    job1_org: "Costtracker AS, Oslo, Norge"
    job1_when: "2024 til nå"
    job1_b1: "Hands-on CTO for produkt og teknologi i et anskaffelses-SaaS med innkjøpsordrer, budsjett og kontantstrøm. Skriver produksjonskode i tillegg til å sette teknisk retning."
    job1_b2: "Ledet overgangen fra outsourcet utvikling til et internt team. Bidro til å bygge teamet, og innførte CI/CD, smidige prosesser, kodestandarder og en dokumentasjonsfokusert kultur."
    job1_b3: "Innførte ende-til-ende- og funksjonalitetstester fra bunnen av, med mål om en teststrategi basert på tillit og pålitelighet fremfor rene dekningsprosenter."
    job1_b4: "Integrerte AI-funksjonalitet, inkludert dokumentparsing og smart kategorisering. Jobbet med skyarkitektur på AWS og Heroku med sikkerhet og etterlevelse i tankene."
    job1_b5: "Nye funksjoner og bedre stabilitet bidro til inntektsvekst og hjalp til med å onboarde noen større kunder."

    job2_title: "Senior programvareutvikler / teknisk leder"
    job2_org: "Sopra Steria AS, Oslo, Norge"
    job2_when: "2023 til 2024"
    job2_b1: "Teknisk leder for et nytt ERP-system hos Bymiljøetaten i Oslo, som støtter private entreprenører innen veivedlikehold. Jobbet sammen med et team på fire utviklere."
    job2_b2: "Bidro til å definere kodearkitektur og dokumentasjonsstandarder, støttet andre utviklere og holdt teknisk gjennomføring på linje med forretningsmålene via OKR."
    job2_b3: "Innførte funksjons- og integrasjonstester tidlig i prosjektet for å fange opp regresjoner før produksjon, og jobbet med teamet om felles kodestandarder."
    job2_b4: "Jobbet som backend-utvikler hos UDI på systemer for visum og oppholdstillatelser. Integrerte Folkeregisteret, jobbet med sentralisert logging med Elasticsearch og Kibana, og bidro til en Azure-migrasjon."

    job3_title: "Senior utvikler"
    job3_org: "Brevio AS, Oslo, Norge"
    job3_when: "2021 til 2023"
    job3_b1: "Senior full-stack-utvikler på Brevio Confirm og Brevio Sign, brukt av flere av Norges større revisjonsfirmaer. Delte backendansvaret med CTO og bidro til arkitekturbeslutninger."
    job3_b2: "Jobbet på tvers av mikrotjenestearkitekturen, bidro til å levere nye produktfunksjoner fra ende til ende, og skrev dokumentasjon for interne API-er og utviklerarbeidsflyter."
    job3_b3: "Økte testdekningen med over 20 prosentpoeng, med fokus på meningsfulle funksjons- og integrasjonstester fremfor bare enhetstestantall. Bidro til å redusere server-sidefeil."
    job3_b4: "Bidro til bedre feilmonitorering, driftsrunbooks og rutiner for hendelseshåndtering."

    job4_title: "Full-stack-utvikler"
    job4_org: "Arvato Finance AS, Oslo, Norge"
    job4_when: "2020 til 2021"
    job4_b1: "Jobbet med å modernisere et eldre faktureringssystem og overgangen til en mikrotjenestearkitektur i .NET, med teknisk dokumentasjon underveis."
    job4_b2: "Innførte integrasjonstester og ende-til-ende-dekning for fakturapipelinen, med mål om mer tillit før hver release."
    job4_b3: "Tok på seg en tech lead-rolle en periode, definerte kodestandarder og feilhåndteringsmønstre sammen med seniorarkitektene, og bidro til onboarding av nyansatte utviklere."

    job5_title: "Full-stack-utvikler til senior utvikler og prosjektleder"
    job5_org: "Luca Labs AS, Oslo, Norge"
    job5_when: "2017 til 2020"
    job5_b1: "Ble med fra oppstartsfasen som full-stack-utvikler (2017 til 2019), forfremmet til senior utvikler (2019 til 2020). Jobbet sammen med CTO på hovedfunksjonene i et nettbasert regnskapssystem: fakturering, lønn, bankavstemmning, skatteinnlevering og automatisert bokføring. Distribuert gjennom DNB og Nordea."
    job5_b2: "Startet Luca Scan som bacheloroppgave sammen med fire medstudenter, og tok deretter over ansvaret alene for videreutvikling og vedlikehold etter at jeg begynte i selskapet. Luca Scan automatiserer registrering av leverandørfakturaer med maskinlæring: tjenesten mottar fakturaer på e-post eller via API-kall, leser dem med en egenutviklet maskinlæringsmodell, og videresender dem i EHF (Elektronisk Handelsformat) til kundens regnskapssystem. Bygget med Ruby on Rails, MySQL, HTML/CSS og JavaScript."
    job5_b3: "Bygget Lucas mobilapp for kvitteringer til Android og iOS, hvor brukeren kunne skanne kvitteringer med AI-drevet gjenkjenning for å automatisere bokføringen på farten."
    job5_b4: "Prøvde å holde testdekningen over 90% gjennom enhets-, funksjons- og ende-til-ende-tester. Skrev og vedlikeholdt utviklerdokumentasjon mens teamet vokste fra 2 til 9 på 18 måneder."
    job5_b5: "Tok på seg prosjektledelse, rekruttering og direkte samarbeid med bankpartnere. Bidro til onboarding av utviklerne som ble ansatt."

    edu_title: "Bachelor i programmering"
    edu_org: "Norges Informasjonsteknologiske Høgskole (NITH)"
    edu_when: "2013 til 2017"
