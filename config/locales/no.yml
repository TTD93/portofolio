  about:
    label: "01 / om meg"
    heading: "En byggmester som liker hele stacken."
    p1: "Jeg er en <b>CTO og senior programvareutvikler</b> med 8+ ars erfaring med a gjore vage ideer til leverte produkter. Jeg startet i tidligfase-startups og har siden jobbet i bade private selskaper og offentlig sektor, noe som gir meg et bredt perspektiv pa hvordan teknologi kan stotte ulike typer organisasjoner."
    p2: "Jeg bruker <b>Ruby on Rails</b> med React og TypeScript til daglig, med AWS i bunn. Jeg har ogsa bred erfaring med <b>.NET, C# og Azure</b> pa offentlige systemer. Det som motiverer meg er muligheten til a fortsette a laere, jobbe tett med andre og bygge teknologi som er bade nyttig og baerekraftig. Basert i <b>Norge</b>, apen for remote-roller verden over."
    stat_years_n: "8+"
    stat_years_l: "ars profesjonell erfaring"
    stat_products_n: "10k+"
    stat_products_l: "bedrifter som bruker produkter jeg bygget"
    stat_oss_n: "5"
    stat_oss_l: "selskaper fra startup til enterprise"
    highlight_perf_icon: "&#9889;"
    highlight_perf_title: "Ytelse forst"
    highlight_perf_body: "Jeg behandler responstid som en funksjon. Mitt verktoy: N+1-fjerning, tellerbuffer, databaseindeksgjennomgang og HTTP-bufring med Turbo Frames."
    highlight_ship_icon: "&#128196;"
    highlight_ship_title: "Leveringskultur"
    highlight_ship_body: "Jeg har innfort CI/CD-pipelines, testpraksis og smidige metoder for palitelig levering. Jeg har ledet team fra 2 til 9 utviklere med testdekning over 90%."
    highlight_data_icon: "&#128202;"
    highlight_data_title: "Strategisk og hands-on"
    highlight_data_body: "Som CTO jobber jeg tett med grunnleggere og produktteam for a oversette forretningsbehov til tekniske losninger, samtidig som jeg fortsatt skriver kode og designer arkitektur som skalerer."
    highlight_remote_icon: "&#127757;"
    highlight_remote_title: "Full-stack bredde"
    highlight_remote_body: "Rails, React, .NET, AWS, Azure, PostgreSQL, mikrotjenester. Jeg laerer det prosjektet krever og har levert innen fintech, offentlig sektor og enterprise SaaS."

