  products:
    label: "03 / produkter"
    heading: "Ting jeg har bygget."
    intro: "Produkter der jeg var nøkkelutvikler eller teknisk leder, bygget fra bunnen av og levert til ekte brukere."
    role_cto: "Hovedutvikler og CTO"
    role_key: "Nøkkelutvikler"
    costtracker_desc: "Et anskaffelses- og utgiftsstyringssystem jeg er med på å bygge og lede som CTO. CostTracker skal gi økonomiteam sanntidsoversikt over bedriftens utgifter, fra innkjøpsrekvisisjoner og flertrinns godkjenningsflyter til budsjettstyring, kontantstrømsprognoser og automatisert rapportering. Integrerer med Xero, QuickBooks, Sage og 24SevenOffice. Brukes av bedrifter i Europa, inkludert noen børsnoterte selskaper."
    luca_desc: "Et norsk regnskapssystem bygget for små bedrifter og enkeltpersonforetak. Jeg kom inn i oppstartsfasen og jobbet med kjernen sammen med CTO: fakturering via e-post, EHF og Vipps, mobil kvitteringsskanning med AI-drevet automatisk bokføring, mva- og skattemeldinger, lønnsoppgjør, bankintegrasjoner og støtte for flere selskaper. Lansert med DNB og pilotert med Nordea. Brukes nå av tusenvis av bedrifter."
    riverty_desc: "Var med i et tverrfaglig team som bygget Rivertys fakturamodul. Plattformen håndterer fakturasyklusen: automatisk generering, distribusjon i flere kanaler (digitalt, e-post, SMS og brev), betalingsoppfølging og debitorstyring, på tvers av Norge, Sverige, Finland og Danmark i fire valutaer."
    brevio_confirm_desc: "En av to hovedutviklere på denne plattformen. Brevio Confirm er en nordisk leverandør av eksterne revisjonsbekreftelser. Revisorer kan bestille bankbekreftelser, advokatbrev og saldoutskrifter fra nordiske banker via én felles portal, og digitaliserer en prosess som tidligere stort sett foregikk på papir. Støtter masseutsending, REST-API og landsspesifikke arbeidsflyter."
    brevio_sign_desc: "Bygget parallelt med Brevio Confirm som én av to kjerneutviklere. Brevio Sign er en digital signeringsplattform for revisorer og regnskapsfirmaer. Støtter de store nordiske eID-metodene, jobber etter EU-standardene i eIDAS og gjør det mulig å signere flere dokumenter i én arbeidsøkt. Betal-per-bruk-modellen gjør det enklere å viderebelaste kundene."
    live_product: "se produktet"

