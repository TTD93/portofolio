  products:
    label: "03 / products"
    heading: "Things I've built."
    intro: "Products I was a key developer or technical lead in building, built from scratch, shipped to real users."
    role_cto: "Main developer and CTO"
    role_key: "Key developer"
    costtracker_desc: "A procurement and spend-management SaaS I built and continue to lead as CTO. CostTracker gives finance teams full real-time visibility into company spending, from purchase requisitions and multi-step approval workflows through to budget tracking, cash-flow forecasting, and automated reporting. Integrates with Xero, QuickBooks, Sage, and 24SevenOffice. Used by growing businesses across Europe, including publicly traded ones."
    luca_desc: "A complete Norwegian accounting system built from scratch for small businesses and sole proprietorships. I joined at founding stage and built the core together with the CTO: invoicing via email, EHF and Vipps, mobile receipt scanning with AI-powered auto-bookkeeping, VAT and tax filing, payroll, bank integrations, and multi-company support. Launched with DNB and piloted with Nordea. Now used by 10,000+ businesses."
    riverty_desc: "Joined a cross-functional team to build Riverty's invoice module from the ground up. The platform handles the full invoice lifecycle: automated generation, multi-channel delivery (digital, email, SMS, letter), payment tracking, and accounts receivable management, across Norway, Sweden, Finland and Denmark in four currencies. Offered as full administration, invoice factoring, or invoice financing."
    brevio_confirm_desc: "One of two main developers who built this platform. Brevio Confirm is the Nordic region's largest provider of external audit confirmations. It lets auditors request bank confirmations, lawyer letters, and balance statements from 250+ Nordic banks through a single portal, digitising a process that used to be entirely paper-based. Supports batch-sending, a REST API, and customisable country-specific workflows."
    brevio_sign_desc: "Co-built alongside Brevio Confirm as one of two core developers. Brevio Sign is a digital signature platform purpose-built for auditors and accounting firms. It supports all major Nordic eID methods, complies with EU eIDAS standards, and enables batch signing across multiple documents in a single session. Pay-per-use pricing makes it easy for firms to pass costs directly to clients."
