    job1_b2: "Bygget ingeniorteamet fra bunnen av, overfort fra outsourcet til fullt intern utvikling, etablert CI/CD, teststandarder og smidige prosesser."
    job1_b3: "Integrert AI-kapabiliteter, designet skalerbar skyarkitektur pa AWS og Heroku, og ledet verktoy- og leverandorvalg."
    job1_b4: "Leverte nye nokkelfunksjoner som bidro til over 25% inntektsvekst og nye borsnoterte kunder."

    job2_title: "Senior programvareutvikler / teknisk leder"
    job2_org: "Above Steria AS (Sopra Steria), Oslo, Norge"
